<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Bot Engineering</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
  <link rel="preload" href="/static/fonts/MaterialSymbolsRounded.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/tailwind.css">
</head>
<body class="flex min-h-screen items-center justify-center bg-gradient-to-br from-slate-900 via-slate-800 to-brand-900 p-4">
  <div class="w-full max-w-sm animate-slide-up">
    <div class="mb-6 flex flex-col items-center text-center">
      <div class="brand-mark h-14 w-14 text-2xl"><span class="mi mi-fill">smart_toy</span></div>
      <h1 class="mt-4 text-xl font-bold text-white">Bot Engineering</h1>
      <p class="text-sm text-slate-300">WhatsApp Ticketing Dashboard</p>
    </div>

    <form class="card !bg-white/95 !p-6 backdrop-blur" method="post" action="/login">
      {% if error %}
        <div class="alert alert-error"><span class="mi">warning</span><span>{{ error }}</span></div>
      {% endif %}

      <div>
        <label class="label" for="password">Password</label>
        <input type="password" name="password" id="password" placeholder="Masukkan password"
               class="input" autofocus required>
      </div>

      <button type="submit" class="btn btn-primary btn-block mt-4">
        <span class="mi">lock_open</span> Masuk
      </button>

      <p class="mt-4 text-center text-[11px] text-slate-500">
        Halaman ini dilindungi. Akses hanya untuk tim engineering.
      </p>
    </form>
  </div>
</body>
</html>
